<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Interview Buddy | Profile</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: Poppins, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 16px;
            width: 360px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #00e5ff;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>Complete Your Profile</h2>

        <input id="name" placeholder="Full Name">
        <input id="email" disabled>

        <select id="qualification">
            <option>Diploma</option>
            <option>BE / BTech</option>
            <option>BSc</option>
            <option>MSc</option>
        </select>

        <input id="branch" placeholder="Branch (CS / IT / ECE)">
        <input id="skills" placeholder="Skills (java, sql, html)">

        <select id="experience">
            <option>Fresher</option>
            <option>0-1 years</option>
            <option>1-3 years</option>
        </select>

        <input id="role" placeholder="Preferred Role">

        <button onclick="saveProfile()">Save & Continue</button>
    </div>

    <script>
        firebase.initializeApp({
            apiKey: "AIzaSyDU1Y-_FaLdZw-3vPBcJhzaGCt4d3DRdcU",
            authDomain: "interviewbuddy-3a3d0.firebaseapp.com",
            projectId: "interviewbuddy-3a3d0"
        });

        const auth = firebase.auth();
        const db = firebase.firestore();
        let currentUser;

        auth.onAuthStateChanged(async user => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }

            currentUser = user;
            email.value = user.email;

            const doc = await db.collection("users").doc(user.uid).get();
            if (doc.exists && doc.data().profileCompleted) {
                window.location.href = "dashboard.html";
            }
        });

        async function saveProfile() {
            const skillsArr = skills.value
                .split(",")
                .map(s => s.trim().toLowerCase())
                .filter(Boolean);

            await db.collection("users").doc(currentUser.uid).set({
                uid: currentUser.uid,
                name: name.value,
                email: currentUser.email,
                qualification: qualification.value,
                branch: branch.value,
                skills: skillsArr,
                experience: experience.value,
                role: role.value,
                profileCompleted: true,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            window.location.href = "dashboard.html";
        }
        async function saveProfile() {
            const user = auth.currentUser;

            if (!user) {
                alert("User not logged in");
                return;
            }

            const name = document.getElementById("name").value.trim();
            const qualification = document.getElementById("qualification").value;
            const branch = document.getElementById("branch").value.trim();
            const skills = document.getElementById("skills").value.trim();
            const experience = document.getElementById("experience").value;
            const role = document.getElementById("role").value.trim();

            if (!name || !branch || !skills || !role) {
                alert("Please fill all required fields");
                return;
            }

            try {
                await db.collection("users").doc(user.uid).set({
                    uid: user.uid,
                    name: name,
                    email: user.email,
                    qualification: qualification,
                    branch: branch,
                    skills: skills.split(",").map(s => s.trim()),
                    experience: experience,
                    role: role,
                    profileCompleted: true,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                // ✅ Redirect to dashboard
                window.location.href = "dashboard.html";

            } catch (error) {
                alert("Error saving profile: " + error.message);
            }
        }

    </script>

</body>

</html>
