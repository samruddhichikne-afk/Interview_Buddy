<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mock Interview</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 30px;
        }

        .box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        video {
            width: 100%;
            border-radius: 15px;
            border: 2px solid white;
        }

        .panel {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>AI Mock Interview</h1>

        <div class="box">
            <video id="camera" autoplay muted playsinline></video>

            <div class="panel">
                <div id="questionText">Click Start to begin</div>
                <div id="transcriptText">Your answer will appear here...</div>

                <button onclick="startInterview()">Start</button>
                <button onclick="stopInterview()" style="background:red;color:white;">Stop</button>

                <div id="feedbackBox" style="margin-top:15px;display:none;"></div>
            </div>
        </div>
    </div>

    <script>

        /* ================= QUESTIONS ================= */

        const QUESTION_TOPICS = {
            "Tell me about yourself": "HR",
            "What are your strengths?": "HR",
            "Why should we hire you?": "HR",
            "Explain OOP concepts": "OOP",
            "Difference between abstract class and interface": "OOP",
            "What is JVM?": "Java",
            "What is SQL?": "SQL",
            "Explain normalization": "SQL",
            "What is HTML5?": "Web"
        };

        const QUESTION_BANK = Object.keys(QUESTION_TOPICS);

        /* ================= VARIABLES ================= */

        let selectedQuestions = [];
        let currentIndex = 0;
        let answers = [];
        let transcript = "";
        let currentQuestion = "";
        let isRunning = false;
        let stream = null;

        /* ================= CAMERA + MIC ================= */

        const video = document.getElementById("camera");

        async function startMedia() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                });
                video.srcObject = stream;
            } catch (err) {
                alert("Camera/Mic permission denied");
                console.error(err);
            }
        }

        function stopMedia() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        }

        /* ================= SPEECH ================= */

        let recognition;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;

            recognition.onresult = (e) => {
                transcript = "";
                for (let i = 0; i < e.results.length; i++) {
                    transcript += e.results[i][0].transcript;
                }
                document.getElementById("transcriptText").innerText = transcript;
            };

            recognition.onend = () => {
                if (!isRunning) return;

                answers.push({ question: currentQuestion, answer: transcript });
                currentIndex++;
                askNextQuestion();
            };

        } else {
            alert("Speech Recognition not supported. Use Chrome.");
        }

        /* ================= INTERVIEW ================= */

        async function startInterview() {

            if (QUESTION_BANK.length < 5) {
                alert("Need at least 5 questions");
                return;
            }

            await startMedia();

            selectedQuestions = [...QUESTION_BANK]
                .sort(() => 0.5 - Math.random())
                .slice(0, 5);

            currentIndex = 0;
            answers = [];
            isRunning = true;

            askNextQuestion();
        }

        function askNextQuestion() {

            if (currentIndex >= selectedQuestions.length) {
                finishInterview();
                return;
            }

            currentQuestion = selectedQuestions[currentIndex];

            document.getElementById("questionText").innerText =
                `Q${currentIndex + 1}: ${currentQuestion}`;

            transcript = "";
            document.getElementById("transcriptText").innerText = "Listening...";

            recognition.start();

            setTimeout(() => {
                recognition.stop();
            }, 10000);
        }

        function stopInterview() {
            isRunning = false;
            recognition.stop();
            stopMedia();
        }

        /* ================= RESULT ================= */

        function finishInterview() {

            isRunning = false;
            stopMedia();

            let totalWords = 0;
            let weakAreas = {};

            answers.forEach(a => {
                let words = a.answer.split(" ").length;
                totalWords += words;

                let topic = QUESTION_TOPICS[a.question];

                if (words < 8) {
                    if (!weakAreas[topic]) weakAreas[topic] = 0;
                    weakAreas[topic]++;
                }
            });

            let score = Math.min(10, Math.floor(totalWords / 30));

            let feedback =
                score >= 8 ? "Excellent" :
                    score >= 5 ? "Good" :
                        "Needs Improvement";

            document.getElementById("feedbackBox").style.display = "block";
            document.getElementById("feedbackBox").innerText =
                `Score: ${score}/10\n${feedback}`;
        }
        if (recognition && isRunning) {
            try {
                recognition.start();
            } catch (e) {
                console.log("Recognition already started");
            }
        }

    </script>

</body>

</html>
